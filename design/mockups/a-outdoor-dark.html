<title>Mockup A · Outdoor Dark</title>

<style>
  :root { --accent:#ff8a3d; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{ font-family:'Inter',system-ui,sans-serif; background:#14161b; color:#eef0f3; }
  #app{ height:100dvh; display:flex; flex-direction:column; max-width:520px; margin:0 auto; position:relative; box-shadow:0 0 60px rgba(0,0,0,.5); }
  #map{ height:100%; width:100%; filter: saturate(0.9) brightness(0.85) hue-rotate(-6deg); }
  .leaflet-popup-content-wrapper{ background:#1f232c; color:#eef0f3; border-radius:12px; }
  .leaflet-popup-tip{ background:#1f232c; }
  .marker-pin{ width:30px; height:30px; border-radius:50% 50% 50% 0; background:var(--accent); transform:rotate(-45deg); box-shadow:0 2px 6px rgba(0,0,0,.5); border:2px solid #14161b; display:flex; align-items:center; justify-content:center; }
  .marker-pin.active{ background:#ffd23f; transform:rotate(-45deg) scale(1.25); z-index:999 !important; }
  .marker-pin span{ transform:rotate(45deg); font-size:11px; font-weight:800; color:#1a1a1a; }
  .grade-chip{ display:inline-flex; align-items:center; justify-content:center; background:#3a2415; color:var(--accent); font-weight:800; border-radius:8px; padding:2px 8px; font-size:.78rem; border:1px solid #5a3620; }
  .card{ background:#1c1f26; border:1px solid #2a2e37; }
  .card:active{ background:#22262f; }
  .pill{ border:1px solid #333844; background:#1c1f26; color:#c7cbd3; }
  .pill.active{ background:var(--accent); border-color:var(--accent); color:#1a1206; font-weight:700; }
  .scrollbar-none::-webkit-scrollbar{ display:none; }
  #detail{ position:absolute; inset:0; top:30dvh; background:#14161b; display:none; flex-direction:column; z-index:20; }
  #detail.open{ display:flex; }
  .fav-star{ transition: transform .15s ease; }
  .fav-star.active{ color:var(--accent); transform:scale(1.15); }
</style>
</head>
<body class="flex justify-center bg-black">
<div id="app">

  <!-- MAP: pinned top 30% -->
  <div style="height:30dvh; flex-shrink:0; position:relative;">
    <div id="map"></div>
    <div class="absolute top-0 left-0 right-0 p-3 flex items-center justify-between pointer-events-none">
      <div class="pointer-events-auto">
        <h1 class="text-white font-extrabold text-lg drop-shadow" style="text-shadow:0 1px 6px rgba(0,0,0,.8)">⛰️ Arco Multipitch</h1>
      </div>
      <button class="pointer-events-auto bg-black/50 backdrop-blur text-white text-sm px-3 py-1.5 rounded-full border border-white/10">★ Trip list · 3</button>
    </div>
  </div>

  <!-- FILTER BAR: sticky right under map -->
  <div class="flex-shrink-0 border-b border-white/10 bg-[#191c22] px-3 py-2">
    <div class="flex gap-2">
      <input placeholder="Search route or crag…" class="flex-1 bg-[#22262f] border border-white/10 rounded-lg px-3 py-2 text-sm placeholder-gray-500 outline-none focus:border-orange-400" />
      <button class="px-3 py-2 rounded-lg border border-white/10 bg-[#22262f] text-sm font-medium" onclick="document.getElementById('filters').classList.toggle('hidden')">Filters</button>
    </div>
    <div id="filters" class="hidden flex flex-wrap gap-1.5 mt-2">
      <span class="pill active px-2.5 py-1 rounded-full text-xs">All grades</span>
      <span class="pill px-2.5 py-1 rounded-full text-xs">5a–6a</span>
      <span class="pill px-2.5 py-1 rounded-full text-xs">6a–7a</span>
      <span class="pill px-2.5 py-1 rounded-full text-xs">☀️ Sunny</span>
      <span class="pill px-2.5 py-1 rounded-full text-xs">≤ 9 pitches</span>
    </div>
  </div>

  <!-- LIST: scrollable, fills remaining space -->
  <div id="list" class="flex-1 overflow-y-auto scrollbar-none px-3 py-3 space-y-2.5"></div>

  <!-- DETAIL: replaces list area (below map), back button -->
  <div id="detail">
    <div class="flex items-center gap-2 px-3 py-3 border-b border-white/10 bg-[#191c22] flex-shrink-0">
      <button onclick="closeDetail()" class="w-9 h-9 rounded-full bg-[#22262f] border border-white/10 flex items-center justify-center text-lg">←</button>
      <h2 id="d-title" class="font-bold text-lg flex-1 truncate"></h2>
      <button id="d-fav" onclick="toggleFav()" class="fav-star text-2xl">☆</button>
    </div>
    <div class="flex-1 overflow-y-auto scrollbar-none">
      <div id="d-photo" class="w-full h-44 bg-cover bg-center"></div>
      <div class="p-4 space-y-4">
        <div id="d-zone" class="text-sm text-gray-400"></div>
        <div class="flex gap-6">
          <div><div class="text-[10px] uppercase text-gray-500 tracking-wide mb-1">Grade</div><span id="d-grade" class="grade-chip"></span></div>
          <div><div class="text-[10px] uppercase text-gray-500 tracking-wide mb-1">Pitches</div><div id="d-pitches" class="font-semibold"></div></div>
          <div><div class="text-[10px] uppercase text-gray-500 tracking-wide mb-1">Length</div><div id="d-length" class="font-semibold"></div></div>
        </div>
        <table class="w-full text-sm">
          <thead><tr class="text-gray-500 text-xs uppercase"><th class="text-left pb-1">P</th><th class="text-left pb-1">Length</th><th class="text-left pb-1">Grade</th></tr></thead>
          <tbody id="d-pitchtable"></tbody>
        </table>
        <div>
          <h4 class="text-[10px] uppercase text-gray-500 tracking-wide mb-1">Trip notes</h4>
          <p id="d-intro" class="text-sm leading-relaxed text-gray-300"></p>
        </div>
        <a id="d-source" href="#" target="_blank" class="block text-orange-400 text-sm pt-2 pb-8">Source: howtoreachthesky.com ↗</a>
      </div>
    </div>
  </div>

</div>

<script>
const ROUTES = JSON.parse(document.getElementById('route-data').textContent);
const favs = new Set();

const map = L.map('map', { zoomControl:false, attributionControl:false }).setView([45.945, 10.91], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const markers = {};
function pinIcon(active){
  return L.divIcon({ className:'', html:`<div class="marker-pin ${active?'active':''}"><span>${active?'●':''}</span></div>`, iconSize:[30,30], iconAnchor:[15,30] });
}
ROUTES.forEach(r => {
  const m = L.marker([r.lat, r.lon], { icon: pinIcon(false) }).addTo(map);
  m.bindPopup(`<div style="min-width:150px"><strong>${r.title}</strong><br><span style="color:#aaa">${r.crag}</span><br><button onclick="openDetail('${r.slug}')" style="margin-top:6px;background:#ff8a3d;color:#1a1206;border:none;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px">View details</button></div>`);
  markers[r.slug] = m;
});

function renderList(){
  const list = document.getElementById('list');
  list.innerHTML = ROUTES.map(r => `
    <div class="card rounded-xl p-2.5 flex gap-3 cursor-pointer" onclick="openDetail('${r.slug}')">
      <img src="${r.photos[0]}" class="w-20 h-20 rounded-lg object-cover flex-shrink-0 bg-gray-800" loading="lazy" />
      <div class="flex-1 min-w-0">
        <div class="flex justify-between items-start gap-2">
          <h3 class="font-semibold text-[15px] truncate">${r.title}</h3>
          <button onclick="event.stopPropagation(); toggleFavCard('${r.slug}', this)" class="fav-star text-xl leading-none flex-shrink-0 ${favs.has(r.slug)?'active':''}">${favs.has(r.slug)?'★':'☆'}</button>
        </div>
        <div class="text-xs text-gray-400 mt-0.5">${r.crag}</div>
        <div class="flex items-center gap-2.5 mt-1.5 text-xs text-gray-400">
          <span class="grade-chip">${r.grade}</span>
          <span>${r.pitches}p</span>
          <span>${r.length}m</span>
          ${r.sun ? '☀️' : ''}
        </div>
      </div>
    </div>`).join('');
}
function toggleFavCard(slug, el){
  if (favs.has(slug)) { favs.delete(slug); el.textContent='☆'; el.classList.remove('active'); }
  else { favs.add(slug); el.textContent='★'; el.classList.add('active'); }
}
renderList();

function openDetail(slug){
  const r = ROUTES.find(x => x.slug === slug);
  document.getElementById('d-title').textContent = r.title;
  document.getElementById('d-photo').style.backgroundImage = `url(${r.photos[0]})`;
  document.getElementById('d-zone').textContent = r.zone;
  document.getElementById('d-grade').textContent = r.grade;
  document.getElementById('d-pitches').textContent = r.pitches;
  document.getElementById('d-length').textContent = r.length + 'm';
  document.getElementById('d-intro').textContent = r.intro;
  document.getElementById('d-source').href = r.source;
  document.getElementById('d-fav').textContent = favs.has(slug) ? '★' : '☆';
  document.getElementById('d-fav').classList.toggle('active', favs.has(slug));
  document.getElementById('d-fav').dataset.slug = slug;
  document.getElementById('d-pitchtable').innerHTML = r.pitchList.map(p => `<tr class="border-t border-white/5"><td class="py-1">${p.n}</td><td class="py-1">${p.len ?? '—'}m</td><td class="py-1"><span class="grade-chip">${p.grade}</span></td></tr>`).join('');
  document.getElementById('detail').classList.add('open');

  Object.entries(markers).forEach(([s,m]) => m.setIcon(pinIcon(s===slug)));
  map.flyTo([r.lat, r.lon], 14, { duration: 0.6 });
}
function closeDetail(){
  document.getElementById('detail').classList.remove('open');
}
function toggleFav(){
  const slug = document.getElementById('d-fav').dataset.slug;
  if (favs.has(slug)) favs.delete(slug); else favs.add(slug);
  document.getElementById('d-fav').textContent = favs.has(slug) ? '★' : '☆';
  document.getElementById('d-fav').classList.toggle('active', favs.has(slug));
  renderList();
}
</script>
