<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mockup C · Native iOS (Konsta UI style)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --ios-blue:#007aff; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif; background:#f2f2f7; color:#000; }
  #app{ height:100dvh; display:flex; flex-direction:column; max-width:520px; margin:0 auto; position:relative; background:#fff; box-shadow:0 0 40px rgba(0,0,0,.2); }
  #map{ height:100%; width:100%; }
  .marker-pin{ width:26px; height:26px; border-radius:50% 50% 50% 0; background:var(--ios-blue); transform:rotate(-45deg); box-shadow:0 1px 4px rgba(0,0,0,.35); border:2px solid white; }
  .marker-pin.active{ background:#ff3b30; transform:rotate(-45deg) scale(1.3); z-index:999 !important; }
  .grade-chip{ display:inline-flex; align-items:center; justify-content:center; background:rgba(0,122,255,.12); color:var(--ios-blue); font-weight:700; border-radius:7px; padding:2px 9px; font-size:.8rem; }
  .ios-list-item{ background:#fff; }
  .ios-list-item:active{ background:#e9e9eb; }
  .ios-sep{ border-bottom:1px solid #e5e5ea; margin-left:76px; }
  .scrollbar-none::-webkit-scrollbar{ display:none; }
  #detail{ position:absolute; inset:0; top:30dvh; background:#f2f2f7; display:none; flex-direction:column; z-index:20; }
  #detail.open{ display:flex; animation: slideUp .28s cubic-bezier(.32,.72,0,1); }
  @keyframes slideUp{ from{ transform:translateY(16px); opacity:.4 } to{ transform:translateY(0); opacity:1 } }
  .navbar{ backdrop-filter: blur(20px); background:rgba(255,255,255,.85); }
  .segmented{ background:#e9e9ec; border-radius:9px; padding:2px; display:inline-flex; }
  .segmented button{ padding:5px 12px; border-radius:7px; font-size:13px; font-weight:600; color:#8a8a8e; }
  .segmented button.active{ background:#fff; color:#000; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .fav-star{ color:#c7c7cc; }
  .fav-star.active{ color:#ff9500; }
  .sheet-handle{ width:36px; height:5px; background:#d1d1d6; border-radius:99px; margin:8px auto; }
  .chevron::after{ content:'›'; color:#c7c7cc; font-size:20px; margin-left:6px; }
</style>
</head>
<body class="flex justify-center bg-gray-400">
<div id="app">

  <!-- MAP: pinned top 30% -->
  <div style="height:30dvh; flex-shrink:0; position:relative;">
    <div id="map"></div>
    <div class="absolute top-0 left-0 right-0 pt-2 px-3 flex items-center justify-between pointer-events-none">
      <div class="pointer-events-auto bg-white/85 backdrop-blur rounded-full px-3 py-1 shadow">
        <h1 class="font-bold text-[15px]">Arco Multipitch</h1>
      </div>
      <button class="pointer-events-auto bg-white/85 backdrop-blur text-[15px] px-3 py-1 rounded-full shadow" style="color:var(--ios-blue)">★ Trip</button>
    </div>
  </div>

  <!-- SEARCH + SEGMENTED FILTER (iOS large-title-search pattern) -->
  <div class="flex-shrink-0 bg-white px-3 pt-2 pb-2 border-b border-gray-200">
    <div class="flex items-center gap-2 bg-[#e9e9ec] rounded-lg px-3 py-1.5 mb-2">
      <span class="text-gray-400 text-sm">⌕</span>
      <input placeholder="Search" class="flex-1 bg-transparent text-[15px] placeholder-gray-400 outline-none" />
    </div>
    <div class="flex items-center justify-between">
      <div class="segmented">
        <button class="active">All</button>
        <button>5a–6a</button>
        <button>6a–7a</button>
      </div>
      <button class="text-[15px] font-medium" style="color:var(--ios-blue)" onclick="document.getElementById('more-filters').classList.toggle('hidden')">Filters</button>
    </div>
    <div id="more-filters" class="hidden flex flex-wrap gap-2 mt-2 text-[13px]">
      <span class="px-2.5 py-1 rounded-full bg-[#e9e9ec]">☀️ Sunny only</span>
      <span class="px-2.5 py-1 rounded-full bg-[#e9e9ec]">≤ 9 pitches</span>
      <span class="px-2.5 py-1 rounded-full bg-[#e9e9ec]">★ Trip list</span>
    </div>
  </div>

  <!-- LIST: iOS grouped table style -->
  <div id="list" class="flex-1 overflow-y-auto scrollbar-none bg-[#f2f2f7]"></div>

  <!-- DETAIL: sheet-like, replaces list below map -->
  <div id="detail">
    <div class="sheet-handle"></div>
    <div class="navbar flex items-center gap-1 px-2 pb-2 flex-shrink-0 sticky top-0 z-10">
      <button onclick="closeDetail()" class="flex items-center text-[17px] px-1" style="color:var(--ios-blue)">‹ Back</button>
      <h2 id="d-title" class="font-semibold text-[17px] flex-1 text-center truncate pr-12"></h2>
    </div>
    <div class="flex-1 overflow-y-auto scrollbar-none">
      <div id="d-photo" class="w-full h-48 bg-cover bg-center"></div>
      <div class="px-4 py-3 flex items-center justify-between bg-white border-b border-gray-200">
        <div id="d-zone" class="text-[13px] text-gray-500"></div>
        <button id="d-fav" onclick="toggleFav()" class="fav-star text-2xl">☆</button>
      </div>
      <div class="flex bg-white border-b border-gray-200 divide-x divide-gray-200">
        <div class="flex-1 text-center py-2.5"><div class="text-[11px] text-gray-400 mb-0.5">GRADE</div><span id="d-grade" class="grade-chip"></span></div>
        <div class="flex-1 text-center py-2.5"><div class="text-[11px] text-gray-400 mb-0.5">PITCHES</div><div id="d-pitches" class="font-semibold text-[15px]"></div></div>
        <div class="flex-1 text-center py-2.5"><div class="text-[11px] text-gray-400 mb-0.5">LENGTH</div><div id="d-length" class="font-semibold text-[15px]"></div></div>
      </div>

      <div class="mt-6 px-4 text-[13px] uppercase text-gray-500 font-medium">Pitches</div>
      <div class="bg-white mt-1.5 mb-6 border-y border-gray-200">
        <table class="w-full text-[15px]">
          <tbody id="d-pitchtable"></tbody>
        </table>
      </div>

      <div class="px-4 text-[13px] uppercase text-gray-500 font-medium">Trip notes</div>
      <div class="bg-white mt-1.5 mb-6 border-y border-gray-200 px-4 py-3">
        <p id="d-intro" class="text-[15px] leading-relaxed text-gray-700"></p>
      </div>

      <a id="d-source" href="#" target="_blank" class="block text-center text-[15px] pb-10" style="color:var(--ios-blue)">Source: howtoreachthesky.com ↗</a>
    </div>
  </div>

</div>

<script>
const ROUTES = JSON.parse(document.getElementById('route-data').textContent);
const favs = new Set();

const map = L.map('map', { zoomControl:false, attributionControl:false }).setView([45.945, 10.91], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const markers = {};
function pinIcon(active){
  return L.divIcon({ className:'', html:`<div class="marker-pin ${active?'active':''}"></div>`, iconSize:[26,26], iconAnchor:[13,26] });
}
ROUTES.forEach(r => {
  const m = L.marker([r.lat, r.lon], { icon: pinIcon(false) }).addTo(map);
  m.bindPopup(`<div style="min-width:150px"><strong>${r.title}</strong><br><span style="color:#666">${r.crag}</span><br><button onclick="openDetail('${r.slug}')" style="margin-top:6px;background:#007aff;color:#fff;border:none;padding:4px 10px;border-radius:6px;font-weight:600;font-size:12px">View details</button></div>`);
  markers[r.slug] = m;
});

function renderList(){
  const list = document.getElementById('list');
  list.innerHTML = `<div class="mt-3"></div>` + ROUTES.map((r,i) => `
    <div>
      <div class="ios-list-item flex gap-3 px-3 py-2.5 cursor-pointer chevron-row" onclick="openDetail('${r.slug}')">
        <img src="${r.photos[0]}" class="w-14 h-14 rounded-lg object-cover flex-shrink-0 bg-gray-100" loading="lazy" />
        <div class="flex-1 min-w-0 flex items-center">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <h3 class="font-medium text-[16px] truncate">${r.title}</h3>
              ${r.sun ? '<span class="text-xs">☀️</span>' : ''}
            </div>
            <div class="text-[13px] text-gray-500 truncate">${r.crag} · ${r.pitches}p · ${r.length}m</div>
          </div>
          <span class="grade-chip mr-1">${r.grade}</span>
          <span class="chevron"></span>
        </div>
      </div>
      ${i < ROUTES.length-1 ? '<div class="ios-sep"></div>' : ''}
    </div>`).join('');
}
renderList();

function openDetail(slug){
  const r = ROUTES.find(x => x.slug === slug);
  document.getElementById('d-title').textContent = r.title;
  document.getElementById('d-photo').style.backgroundImage = `url(${r.photos[0]})`;
  document.getElementById('d-zone').textContent = r.zone;
  document.getElementById('d-grade').textContent = r.grade;
  document.getElementById('d-pitches').textContent = r.pitches;
  document.getElementById('d-length').textContent = r.length + 'm';
  document.getElementById('d-intro').textContent = r.intro;
  document.getElementById('d-source').href = r.source;
  document.getElementById('d-fav').textContent = favs.has(slug) ? '★' : '☆';
  document.getElementById('d-fav').classList.toggle('active', favs.has(slug));
  document.getElementById('d-fav').dataset.slug = slug;
  document.getElementById('d-pitchtable').innerHTML = r.pitchList.map((p,i) => `<tr class="${i>0?'border-t border-gray-100':''}"><td class="py-2 pl-4 text-gray-500 w-8">${p.n}</td><td class="py-2 text-gray-700">${p.len ?? '—'}m</td><td class="py-2 pr-4 text-right"><span class="grade-chip">${p.grade}</span></td></tr>`).join('');
  document.getElementById('detail').classList.add('open');

  Object.entries(markers).forEach(([s,m]) => m.setIcon(pinIcon(s===slug)));
  map.flyTo([r.lat, r.lon], 14, { duration: 0.6 });
}
function closeDetail(){
  document.getElementById('detail').classList.remove('open');
}
function toggleFav(){
  const slug = document.getElementById('d-fav').dataset.slug;
  if (favs.has(slug)) favs.delete(slug); else favs.add(slug);
  document.getElementById('d-fav').textContent = favs.has(slug) ? '★' : '☆';
  document.getElementById('d-fav').classList.toggle('active', favs.has(slug));
}
</script>
